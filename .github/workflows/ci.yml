name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify repository
        run: make verify

  model-matrix:
    name: Model matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships mikefarah/yq. Validate that the model matrix parses
      # and the fetch script runs clean (dry-run, no downloads). This guards the
      # matrix/script the env-gated native smoke tests depend on.
      - name: Validate model matrix and fetch script
        run: FETCH_DRY_RUN=1 make fetch-test-models
