# golangci-lint v2 config. Keep this gate focused on correctness-oriented
# checks first; style-only expansion should happen after the tree is already
# clean under these rules.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: speaker/operations_test\.go
        text: "SA1012"
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
